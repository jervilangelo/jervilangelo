<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Jervil Angelo De Leon</title>
<desc id="d">Cloud and infrastructure portfolio banner: Building my way into the cloud. HRIS Technical Support, AWS Certified, Cloud and Infrastructure.</desc>
<style>
  :root { --bg:#1c1c1c; --fg:#f5f5f4; --muted:#a3a3a3; --dim:#3a3a3a; --grid:#2a2a2a; --box:#232323; --accent:#ff9900; --ok:#22c55e; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --fg:#171717; --muted:#525252; --dim:#d4d4d4; --grid:#ececec; --box:#fafafa; --accent:#e07b00; --ok:#16a34a; }
  }
  .bg { fill:var(--bg); }
  .border { fill:none; stroke:var(--dim); }
  .grid circle { fill:var(--grid); }
  .sans { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .name { fill:var(--fg); font-size:52px; font-weight:700; letter-spacing:-1.5px; }
  .tag { fill:var(--accent); font-size:20px; }
  .roles { fill:var(--muted); font-size:15px; }
  .url { fill:var(--muted); font-size:13px; }
  .cursor { fill:var(--accent); animation: blink 1s steps(1) infinite; }
  .live { fill:var(--ok); }
  .pulse { fill:none; stroke:var(--ok); animation: pulse 2.4s ease-out infinite; transform-origin:62px 60px; transform-box: view-box; }
  .fade { opacity:0; animation: fadeUp .8s ease-out forwards; }
  .nbox { fill:var(--box); stroke:var(--dim); }
  .ndot { fill:var(--accent); }
  .nlabel { fill:var(--fg); font-size:13px; font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  .node { opacity:0; animation: fadeUp .7s ease-out forwards; }
  .wire { fill:none; stroke:var(--dim); stroke-width:1.5; stroke-dasharray:4 4; animation: flow 1.2s linear infinite; }
  .packet { fill:var(--accent); }
  .hot .nbox { animation: glow 3.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.8; } 100% { transform:scale(3); opacity:0; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes flow { to { stroke-dashoffset:-16; } }
  @keyframes glow { 0%,100% { stroke:var(--dim); } 50% { stroke:var(--accent); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; } }
</style>
