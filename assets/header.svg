<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Jervil Angelo De Leon, Cloud and Infrastructure Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f2a3f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 40px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; opacity: 0; animation: fadeUp 1s ease-out 0.2s forwards; }
    .sub  { font: 500 17px 'Courier New', monospace; fill: #38BDF8; opacity: 0; animation: fadeUp 1s ease-out 0.8s forwards; }
    .bar  { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s ease-out 1.2s forwards; }
    .link { stroke: #38BDF8; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .node { fill: #38BDF8; animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node.o { fill: #FF9900; }
    .d1 { animation-delay: .3s } .d2 { animation-delay: .8s } .d3 { animation-delay: 1.3s } .d4 { animation-delay: 1.8s }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.6); opacity: .4; } }
  </style>

  <rect width="900" height="200" rx="14" fill="url(#bg)"/>

  <!-- network graphic, right side -->
  <g>
    <line class="link" x1="640" y1="50"  x2="730" y2="110"/>
    <line class="link" x1="730" y1="110" x2="820" y2="55"/>
    <line class="link" x1="730" y1="110" x2="780" y2="165"/>
    <line class="link" x1="640" y1="50"  x2="590" y2="130"/>
    <line class="link" x1="590" y1="130" x2="730" y2="110"/>
    <circle class="node d1" cx="640" cy="50"  r="6"/>
    <circle class="node o d2" cx="730" cy="110" r="8"/>
    <circle class="node d3" cx="820" cy="55"  r="6"/>
    <circle class="node d4" cx="780" cy="165" r="5"/>
    <circle class="node d2" cx="590" cy="130" r="5"/>
  </g>

  <text class="name" x="48" y="95">Jervil Angelo De Leon</text>
  <text class="sub" x="48" y="130">Cloud &amp; Infrastructure | AWS | Automation</text>
  <line class="bar" x1="48" y1="150" x2="440" y2="150" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
</svg>
